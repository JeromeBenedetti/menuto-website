deptrac:
    paths:
        - ./src
    exclude_files:
        - '#.*test.*#'
    layers:
        -
            name: Domain
            collectors:
                -
                    type: bool
                    must:
                        -
                            type: directory
                            value: src/Domain/.*
                    must_not:
                        -
                            type: directory
                            value: vendor/.*
        -
            name: Application
            collectors:
                -
                    type: bool
                    must:
                        -
                            type: directory
                            value: src/Application/.*
                    must_not:
                        -
                            type: directory
                            value: vendor/.*
        -
            name: Infrastructure
            collectors:
                -
                    type: bool
                    must:
                        -
                            type: directory
                            value: src/Infrastructure/.*
                    must_not:
                        -
                            type: directory
                            value: vendor/.*
        -
            name: Vendor
            collectors:
                -
                    type: bool
                    must:
                        -
                            type: classLike
                            value: .*
                    must_not:
                        -
                            type: layer
                            value: Infrastructure
                        -
                            type: layer
                            value: Domain
                        -
                            type: layer
                            value: Application


    ruleset:
        Domain:
            - Domain
        Application:
            - Domain
            - Application
        Infrastructure:
            - Infrastructure
            - +Application
            - Vendor
